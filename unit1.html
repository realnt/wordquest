<body><a href="index.html" style="position:fixed;bottom:12px;right:12px;z-index:9999;background:#173b4b;color:white;font:700 13px system-ui,sans-serif;padding:11px 14px;border-radius:12px;text-decoration:none;box-shadow:0 4px 18px #0002">⌂ All Units / 全部单元</a><div id="app"></div><script>
'use strict';
const chapters=[
 {id:'A',name:'Be Curious',icon:'🧭',detail:'Explore and build compounds'},
 {id:'B',name:'Just Do It',icon:'🛠️',detail:'Clubs, actions and word forms'},
 {id:'C',name:'Never Give Up',icon:'☀️',detail:'Build a solar invention'},
 {id:'D',name:'Be Creative',icon:'💡',detail:'Solve a real-world problem'},
 {id:'E',name:'Have a Try',icon:'🏆',detail:'The final inventor challenge'}
];
const missions=[
 {ch:'A',icon:'⛵',title:'Catch the Wind',type:'build',word:'windsurfing',scene:'You want to ride the waves on a board with a sail. The wind will move you across the water.',question:'Build the name of this sport.',tokens:['surfing','garden','wind','rain'],answer:['wind','surfing'],hint:['A sail needs moving air.','Start with WIND, then add SURFING.'],explain:'WIND + SURFING → WINDSURFING. This is a compound: two familiar words make one new word.',zh:'帆板运动。wind（风）与 surfing（冲浪）组合。',origin:'A modern compound. No Latin root is needed to understand its structure.',url:'https://www.etymonline.com/search?q=windsurf'},
 {ch:'A',icon:'🌱',title:'Garden in the Sky',type:'build',word:'roof gardening',scene:'A school has no garden on the ground, but there is a large space on top of the building.',question:'Build the name of the school club.',tokens:['roof','road','gardening','swimming'],answer:['roof','gardening'],hint:['Where is this garden?','The first word is ROOF. The second is GARDENING.'],explain:'ROOF + GARDENING → ROOF GARDENING. Some compounds keep a space between their parts.',zh:'屋顶园艺。roof 是屋顶，gardening 是园艺。',origin:'This is a transparent English compound phrase, not an ancient Latin root.',url:''},
 {ch:'A',icon:'🚦',title:'Stop or Go?',type:'build',word:'traffic light',scene:'Cars are coming from different roads. Your team needs a signal to tell drivers when to stop and go.',question:'Build the name of this useful device.',tokens:['traffic','street','light','lamp'],answer:['traffic','light'],hint:['It controls vehicles on roads.','The words are TRAFFIC and LIGHT.'],explain:'TRAFFIC + LIGHT → TRAFFIC LIGHT. Understanding both parts helps you guess the whole phrase.',zh:'交通信号灯。traffic 表示交通，light 表示灯。',origin:'Two everyday English words form a compound phrase.',url:''},
 {ch:'A',icon:'🔍',title:'A Curious Mind',type:'choice',word:'curious',scene:'Mia sees a machine she has never seen before. She asks: “How does it work? Can I try it?”',question:'Which word best describes Mia?',options:['curious','troublesome','proud'],answer:0,hint:['She wants to learn something new.','The word begins with C and means eager to know.'],explain:'CURIOUS means eager to know or learn. Mia asks questions because she is curious.',zh:'curious：好奇的。',origin:'Curious comes through French from Latin curiosus, linked to cura (“care”). Being curious once suggested careful attention.',url:'https://www.etymonline.com/word/curious'},
 {ch:'A',icon:'📚',title:'A Word Warehouse',type:'choice',word:'magazine',scene:'A word for familiar reading material once meant a place for storing goods. Later it came to describe a publication collecting interesting information.',question:'What modern school reading material has that name?',options:['magazine','machine','board'],answer:0,hint:['It contains articles, photos and news.','It starts with MAG-.'],explain:'A MAGAZINE stores information, just as a warehouse stores goods. That shift in meaning makes the word memorable.',zh:'magazine：杂志。早期来源与仓库、储藏有关。',origin:'Magazine entered English in the 1580s through French, which borrowed it from Italian. Its history can be traced back to Arabic makhāzin, the plural of makhzan (“storehouse”). The meaning “periodical publication” dates to 1731.',url:'https://www.etymonline.com/word/magazine'},
 {ch:'B',icon:'🖨️',title:'The 3D Club',type:'build',word:'printing',scene:'A club uses a special machine to make 3D models. The students enjoy 3D ______.',question:'Build the noun that completes the sentence.',tokens:['print','press','ing','er'],answer:['print','ing'],hint:['Start from the verb PRINT.','Add -ING to name the activity.'],explain:'PRINT + -ING → PRINTING. In “3D printing,” PRINTING is a noun for an activity or process. In “I am printing,” it is part of a verb phrase.',zh:'printing：印刷、打印；词表还收录 print（打印）。',origin:'-ing has a long history in English as a word-forming ending. This is a word-form lesson, not an ancient-root quiz.',url:''},
 {ch:'B',icon:'🍓',title:'The School Garden',type:'choice',word:'grow',scene:'Lu Yao puts seeds into the soil. After a few weeks, the plants become bigger and produce strawberries.',question:'What do the plants do?',options:['grow','print','fail'],answer:0,hint:['Think of what plants do as they get bigger.','It starts with G.'],explain:'Plants GROW. We can also grow vegetables, and a person can grow more confident.',zh:'grow：生长；种植。',origin:'Grow is an old Germanic word. Its meaning is easier to learn through real scenes than Latin roots.',url:'https://www.etymonline.com/word/grow'},
 {ch:'B',icon:'🛠️',title:'The Better Robot',type:'choice',word:'improve',scene:'Your first robot moves slowly. After you change its wheels and code, it works much better.',question:'What did you do to the robot?',options:['improve it','camp with it','take it away'],answer:0,hint:['The robot is better than it was before.','Choose the expression that means make better.'],explain:'IMPROVE means make better. But do not assume it comes from IM- (“not”) + PROVE.',zh:'improve：改善、改进。注意：不能机械拆成 im-（否定）+ prove。',origin:'Etymonline traces improve to Anglo-French emprouwer, “turn to profit,” not to the modern word prove. Spelling can mislead!',url:'https://www.etymonline.com/word/improve'},
 {ch:'B',icon:'⛺',title:'Club Weekend',type:'choice',word:'camp',scene:'Your team will sleep outdoors in tents, cook together and watch the stars.',question:'Which activity is the team planning?',options:['printing','camping','windsurfing'],answer:1,hint:['You sleep outside in a tent.','The base verb is CAMP.'],explain:'To CAMP means to stay outdoors, often in tents. CAMPING is the -ing form used for the activity.',zh:'camp：露营；营地。',origin:'Camp comes from a word for an open field, later used for an army’s outdoor site.',url:'https://www.etymonline.com/word/camp'},
 {ch:'C',icon:'🔋',title:'Power from the Sun',type:'build',word:'solar cell',scene:'Your new invention must turn sunlight into electricity. You need a small unit that converts light into electric energy.',question:'Build the term for this device.',tokens:['solar','traffic','cell','board'],answer:['solar','cell'],hint:['The energy comes from the sun.','Use SOLAR, then CELL.'],explain:'SOLAR CELL. “Solar” means related to the sun. A solar cell converts light into electrical energy.',zh:'solar cell：太阳能电池，课本第18页词组。',origin:'Solar comes from Latin sol (“sun”). The term solar cell entered technical English in the 20th century.',url:'https://www.etymonline.com/word/solar'},
 {ch:'C',icon:'🔄',title:'Energy That Returns',type:'build',word:'renewable',scene:'The solar cells collect energy from sunlight. The source can be naturally replaced instead of being used up forever.',question:'Build an adjective meaning “able to be renewed”.',tokens:['able','re','non','new','less'],answer:['re','new','able'],hint:['RE- means “again”; -ABLE means “can be”.','Put RE + NEW + ABLE in that order.'],explain:'RE + NEW + ABLE → RENEWABLE. “Able to be made new again” helps explain the modern energy use.',zh:'renewable：可再生的。',origin:'Renewable is recorded from 1727; its modern energy-related meaning is attested by 1971.',url:'https://www.etymonline.com/word/renewable'},
 {ch:'C',icon:'🚧',title:'Nothing Is Impossible',type:'build',word:'impossible',scene:'The scientists keep failing. Some people say: “This idea cannot work!”',question:'Build the word meaning “not possible”.',tokens:['im','re','possible','ful'],answer:['im','possible'],hint:['Choose a negative prefix.','Before P, IN- often appears as IM-.'],explain:'IM- + POSSIBLE → IMPOSSIBLE. IM- is a form of the negative prefix IN-.',zh:'impossible：不可能的。这里 im- 表否定。',origin:'The prefix im- can represent “not” before p, b and m. Compare impossible and impatient.',url:'https://www.etymonline.com/word/im-'},
 {ch:'C',icon:'🏷️',title:'A Sticky Idea',type:'build',word:'sticker',scene:'The scientists want small solar devices that can attach to bags and windows. They need a thin label-like invention.',question:'Build the word for something that sticks to a surface.',tokens:['er','stick','ing','print'],answer:['stick','er'],hint:['Start with the verb meaning attach or fasten.','Use STICK + -ER.'],explain:'STICK + -ER → STICKER. The ending can refer to a person or thing related to an action.',zh:'sticker：贴纸。教材同时收录 stick（粘贴）。',origin:'Sticker originally referred to one who or something that sticks/stabs; the adhesive-label sense is recorded from 1871.',url:'https://www.etymonline.com/word/sticker'},
 {ch:'C',icon:'♾️',title:'Try Again and Again',type:'build',word:'countless',scene:'The team tests the invention so many times that nobody remembers the number.',question:'Build an adjective meaning “too many to count”.',tokens:['full','count','re','less'],answer:['count','less'],hint:['The first part means find the number.','-LESS can mean “without”.'],explain:'COUNT + -LESS → COUNTLESS, meaning too many to be counted.',zh:'countless：无数的、数不尽的。',origin:'Countless is recorded from the 1580s as count + -less.',url:'https://www.etymonline.com/word/countless'},
 {ch:'C',icon:'🧪',title:'The Pizza Box Trick',type:'choice',word:'separate',scene:'The scientists put a thin layer between two parts. Now they can move one part away from the other.',question:'Which verb describes what they do?',options:['separate','discuss','grow'],answer:0,hint:['The two pieces stop being joined together.','Choose the word that means move apart.'],explain:'SEPARATE means to divide or move apart. In the story it helps the scientists solve the design problem.',zh:'separate：分开、隔开。',origin:'The word comes from Latin separare, “set apart”.',url:'https://www.etymonline.com/word/separate'},
 {ch:'C',icon:'🌈',title:'Still Hopeful',type:'build',word:'hopefully',scene:'Your team says: “______ , our new solar device will help many people one day.”',question:'Build the adverb for this sentence.',tokens:['ly','less','hope','ful'],answer:['hope','ful','ly'],hint:['HOPE + -FUL first makes HOPEFUL.','Then add -LY to form the adverb.'],explain:'HOPE + FUL + LY → HOPEFULLY. In this sentence, it means “we hope”.',zh:'hopefully：有希望地；用于句首也可表示“希望如此”。',origin:'Hopefully was first formed with the sense “in a hopeful manner”; the sentence-adverb use is recorded from the 20th century.',url:'https://www.etymonline.com/word/hopefully'},
 {ch:'C',icon:'🎉',title:'At Last, It Works!',type:'choice',word:'succeed',scene:'The team has failed many times. Today the solar sticker finally works exactly as planned!',question:'What did the team finally do?',options:['succeed','burn','take away'],answer:0,hint:['They got the result they wanted.','Choose the opposite of FAIL.'],explain:'SUCCEED means achieve what you tried to do. The team succeeded after many failures.',zh:'succeed：成功，与 fail（失败）形成语义对比。',origin:'Succeed originally meant “come after, follow”; the sense of achieving success developed later.',url:'https://www.etymonline.com/word/succeed'},
 {ch:'C',icon:'❤️',title:'How Do You Feel?',type:'choice',word:'feeling',scene:'You smile when the experiment works and feel nervous before showing it to the school.',question:'Which noun describes happiness or nervousness?',options:['feeling','traffic','holder'],answer:0,hint:['Think of emotions inside your mind.','It comes from FEEL + -ING.'],explain:'FEELING can mean an emotion. It was also once closely connected to the sense of touch.',zh:'feeling：感受、情感。',origin:'Feeling first referred to touch or sensation. Its emotional sense developed later.',url:'https://www.etymonline.com/word/feeling'},
 {ch:'D',icon:'💡',title:'A New Kind of Idea',type:'build',word:'creative',scene:'A student combines an umbrella with a walking stick to help someone stay dry. It is an original idea.',question:'Build the adjective for a person with new ideas.',tokens:['create','ness','ive','less'],answer:['create','ive'],hint:['CREATE means bring something new into being.','Add -IVE to CREATE.'],explain:'CREATE (drop final -e) + -IVE → CREATIVE. It describes someone who can make or imagine new things.',zh:'creative：有创造力的。',origin:'Creative comes from create + -ive. Create reaches back to Latin creare, “make, produce, bring forth”.',url:'https://www.etymonline.com/word/creative'},
 {ch:'D',icon:'☂️',title:'Where to Hold It',type:'choice',word:'handle',scene:'You attach an umbrella to a walking stick. You need a part that a person can hold easily.',question:'What do you add to the design?',options:['a handle','a traffic light','a solar cell'],answer:0,hint:['It is made for someone’s hand.','Think of HAND → HANDLE.'],explain:'A HANDLE is the part you hold with your hand. The spelling and meaning make a useful connection.',zh:'handle：把手、柄。',origin:'Handle is historically connected with the word hand.',url:'https://www.etymonline.com/word/handle'},
 {ch:'D',icon:'🏅',title:'A Proud Moment',type:'choice',word:'proud',scene:'Your design works. Your grandmother smiles and says, “You worked so hard. I am very ______ of you!”',question:'Choose the word that completes her sentence.',options:['proud','countless','impossible'],answer:0,hint:['She feels happy about what you achieved.','The common phrase is “be ___ of”.'],explain:'BE PROUD OF someone means to feel pleased about what they have done.',zh:'proud：自豪的、骄傲的。常用 be proud of。',origin:'Proud came through French with earlier senses connected to being worthy or excellent.',url:'https://www.etymonline.com/word/proud'},
 {ch:'E',icon:'🔧',title:'Final Build · Step 1',type:'choice',word:'solar panel',scene:'Your school wants to collect energy from sunlight. The science team asks you to choose the right main device.',question:'What should you install to collect solar energy?',options:['a solar panel','a traffic light','a pizza box'],answer:0,hint:['Think of SUNLIGHT and ENERGY.','The compound begins with SOLAR.'],explain:'A SOLAR PANEL is designed to absorb sunlight to help produce energy. You have applied Unit 1 science vocabulary.',zh:'solar panel：太阳能电池板。',origin:'Solar comes from Latin sol, meaning sun. Solar panel is a modern technical compound.',url:'https://www.etymonline.com/word/solar'},
 {ch:'E',icon:'🌍',title:'Final Build · Step 2',type:'choice',word:'renewable / improve / succeed',scene:'Your invention is light, useful and solar-powered. The team will test it again and again until it works.',question:'Which project report best describes your plan?',options:['Use renewable energy, improve our design, and never give up.','Burn the solar cells and stop trying.','Keep the heavy holder and refuse to test new ideas.'],answer:0,hint:['Choose the plan that helps the world and makes the invention better.','Look for RENEWABLE and IMPROVE together.'],explain:'Excellent! You have connected word meanings with the main message of Unit 1: try, test, improve and keep going.',zh:'最终挑战：运用 renewable、improve 和其他教材核心词描述一个发明计划。',origin:'One final reminder: meaningful English communication matters more than memorising obscure word origins.',url:''}
];

const missionTranslations=[{"titleZh":"乘风破浪","sceneZh":"你想站在带有帆的板上，借助风力在水面滑行。","questionZh":"拼出这项运动的英语名称。","hintsZh":["帆需要流动的空气才能移动。","先选 WIND，再加上 SURFING。"],"explainZh":"WIND（风）+ SURFING（冲浪运动）→ WINDSURFING（帆板运动）。两个常见词组合成一个合成词。","originZh":"这是一个现代英语合成词。理解它不需要背拉丁语词根。","formation":"Compound word: WIND + SURFING → WINDSURFING.","formationZh":"合成构词：WIND + SURFING → WINDSURFING。"},{"titleZh":"空中花园","sceneZh":"学校没有地面花园，但教学楼顶部有一大片空地。","questionZh":"拼出这个学校社团的活动名称。","hintsZh":["这个花园建在哪里？","第一个词是 ROOF，第二个词是 GARDENING。"],"explainZh":"ROOF（屋顶）+ GARDENING（园艺）→ ROOF GARDENING（屋顶园艺）。有些合成表达保留词间空格。","originZh":"这是意思比较直观的现代英语组合短语，不涉及古老的拉丁词根。","formation":"Open compound: ROOF + GARDENING → ROOF GARDENING.","formationZh":"开放式合成词组：ROOF（屋顶）+ GARDENING（园艺）。"},{"titleZh":"停还是行？","sceneZh":"汽车正从不同道路驶来。你的团队需要一种信号装置，告诉司机何时停车、何时通行。","questionZh":"拼出这个有用装置的英语名称。","hintsZh":["它用于指挥道路上的车辆。","这两个词是 TRAFFIC 和 LIGHT。"],"explainZh":"TRAFFIC（交通）+ LIGHT（灯）→ TRAFFIC LIGHT（交通信号灯）。理解两部分有助于猜出整个短语。","originZh":"两个日常英语单词构成一个合成词组。","formation":"Open compound: TRAFFIC + LIGHT → TRAFFIC LIGHT.","formationZh":"开放式合成词组：TRAFFIC（交通）+ LIGHT（灯）。"},{"titleZh":"充满好奇的头脑","sceneZh":"米娅看到一台从未见过的机器，问：“它是怎么工作的？我可以试试吗？”","questionZh":"哪个词最能形容米娅？","hintsZh":["她想了解新事物。","这个词以 C 开头，表示渴望了解。"],"explainZh":"CURIOUS 意为“好奇的、渴望了解的”。米娅因为好奇而不断提问。","originZh":"curious 一词经由古法语等途径传入英语，可追溯到拉丁语 curiosus，并与 cura（关心、留意）有词源联系。","grammar":"CURIOUS is an adjective: “a curious student” / “She is curious.”","grammarZh":"CURIOUS 是形容词：a curious student（好奇的学生）；She is curious.（她很好奇）。"},{"titleZh":"单词仓库","sceneZh":"一个如今很常见的阅读材料名称，过去曾指储存货物的地方。后来，这个词又被用来表示汇集各种有趣信息的出版物。","questionZh":"哪一种现代读物使用了这个名称？","hintsZh":["它包含文章、照片和新闻。","这个词以 MAG- 开头。"],"explainZh":"MAGAZINE（杂志）汇集信息，就像 WAREHOUSE（仓库）储存货物。词义的这种变化值得记住。","originZh":"magazine 于16世纪后期经由意大利语、法语传入英语，其词源可追溯到阿拉伯语 makhāzin，意为“仓库”（复数形式；单数为 makhzan）。1731 年开始出现“期刊、杂志”的含义。","grammar":"MAGAZINE is a countable noun: “a magazine” / “two magazines.”","grammarZh":"MAGAZINE 是可数名词：a magazine（一本杂志）；two magazines（两本杂志）。"},{"titleZh":"3D 打印社团","sceneZh":"社团使用一台特殊机器制作三维模型。同学们很喜欢 3D ______。","questionZh":"拼出填入句中的名词。","hintsZh":["从动词 PRINT 开始。","加上 -ING，构成表示这一活动的词。"],"explainZh":"PRINT + -ING → PRINTING。在“3D printing”中，printing 是名词，指打印这项活动或工艺。不过，-ing 形式并不总是名词。","originZh":"-ing 是英语中历史悠久的构词及语法形式。本关重点是构词与词性，不是猜测古代词根。","formation":"Word formation: PRINT (verb) + -ING → PRINTING. Here it names an activity or process.","formationZh":"构词：PRINT（动词，打印）+ -ING → PRINTING。这里指打印这项活动或工艺。","grammar":"Compare: “3D printing is useful.” → PRINTING is a noun. “I am printing a photo.” → PRINTING is the present participle in a verb phrase. The ending -ING does not always make a noun.","grammarZh":"比较：3D printing is useful.（3D 打印很有用）中的 PRINTING 是名词；I am printing a photo.（我正在打印照片）中的 PRINTING 是动词短语中的现在分词。所以加 -ING 不一定变成名词。"},{"titleZh":"学校花园","sceneZh":"陆瑶把种子种进土里。几个星期后，植物长高了，还结出了草莓。","questionZh":"植物正在做什么？","hintsZh":["想想植物变大、变高的过程。","答案以 G 开头。"],"explainZh":"植物会 GROW（生长）。我们也可以 grow vegetables（种蔬菜），人还可以 grow more confident（变得更加自信）。","originZh":"Grow 是古老的日耳曼语系词汇。通过真实场景理解它，比强行拆拉丁词根更有效。","grammar":"GROW is a verb. “Plants grow.” / “We grow vegetables.”","grammarZh":"GROW 是动词：Plants grow.（植物生长）；We grow vegetables.（我们种蔬菜）。"},{"titleZh":"更棒的机器人","sceneZh":"你的第一代机器人行动缓慢。你修改了它的轮子和程序，机器人就运行得好多了。","questionZh":"你对机器人做了什么？","hintsZh":["现在的机器人比以前更好了。","选择表示“使……变得更好”的表达。"],"explainZh":"IMPROVE 表示“改善、改进”。但不要因为拼写相似，就把它误拆为否定前缀 IM- 加 PROVE。","originZh":"improve 一词经由盎格鲁法语 emprouwer 进入英语，其更早的词源可追溯到拉丁语 prode。它并不是由现代英语的 im-（否定）与 prove 构成。","grammar":"IMPROVE is a verb: “We improved the robot.” / “The robot improved.”","grammarZh":"IMPROVE 是动词：We improved the robot.（我们改进了机器人）；The robot improved.（机器人变好了）。"},{"titleZh":"周末社团活动","sceneZh":"你的团队将在户外帐篷里过夜，一起做饭、观星。","questionZh":"团队打算参加哪种活动？","hintsZh":["你要睡在户外的帐篷里。","基本动词是 CAMP。"],"explainZh":"CAMP 可以表示“露营”。CAMPING 是它的 -ing 形式，在这里指露营这项活动。","originZh":"Camp 与原本表示开阔田野的词有关，后来也用于指军队在户外扎营的场所。","grammar":"In “We are camping,” CAMPING is part of a verb phrase. In “Camping is fun,” CAMPING functions as a noun (gerund).","grammarZh":"We are camping.（我们正在露营）中，CAMPING 是动词短语的一部分；Camping is fun.（露营很好玩）中，CAMPING 是动名词，用法相当于名词。"},{"titleZh":"来自太阳的能量","sceneZh":"你的新发明必须把阳光转化为电能。你需要一个能将光转换为电能的小装置。","questionZh":"拼出这种装置的名称。","hintsZh":["能量来自太阳。","先选择 SOLAR，再选 CELL。"],"explainZh":"SOLAR CELL 表示“太阳能电池”。Solar 意为“太阳的”，太阳能电池可将光转化为电能。","originZh":"solar 一词可追溯到拉丁语 sol（太阳）；solar cell 则由 solar 与 cell 构成，是现代科技英语词组。","formation":"SOLAR + CELL → SOLAR CELL, a technical compound phrase.","formationZh":"SOLAR（太阳的）+ CELL（电池单元）→ SOLAR CELL（太阳能电池）。"},{"titleZh":"可以再次获得的能源","sceneZh":"太阳能电池从阳光中获取能量。这种能源能够自然补充，而不是一次用完就再也没有。","questionZh":"拼出表示“可以再生的”的形容词。","hintsZh":["RE- 表示“再次”；-ABLE 表示“能够……的”。","按照 RE + NEW + ABLE 的顺序拼接。"],"explainZh":"RE + NEW + ABLE → RENEWABLE（可再生的）。可以再次补充或恢复，这有助于理解它在能源领域的意思。","originZh":"Renewable 一词在英语中的记载早于现代能源讨论；表示可再生能源的用法则是较晚发展的。","formation":"Prefix RE- + NEW + suffix -ABLE → RENEWABLE (adjective).","formationZh":"前缀 RE-（再次）+ NEW（新的）+ 后缀 -ABLE（能够……的）→ RENEWABLE（形容词）。","grammar":"RENEWABLE is an adjective: “renewable energy.”","grammarZh":"RENEWABLE 是形容词：renewable energy（可再生能源）。"},{"titleZh":"没有什么是不可能的","sceneZh":"科学家一次又一次失败。有人说：“这个点子根本行不通！”","questionZh":"拼出表示“不可能的”的单词。","hintsZh":["选择一个表示否定的前缀。","在 P 前面，IN- 常变成 IM-。"],"explainZh":"IM- + POSSIBLE → IMPOSSIBLE。这里 IM- 是否定前缀 IN- 的变体。","originZh":"否定前缀 im- 常见于 p、b、m 等辅音前，例如 impossible 和 impatient。注意并非所有 im- 开头的词都有这个否定前缀。","formation":"Negative prefix IM- + POSSIBLE → IMPOSSIBLE.","formationZh":"否定前缀 IM- + POSSIBLE（可能的）→ IMPOSSIBLE（不可能的）。","grammar":"IMPOSSIBLE is an adjective: “an impossible task.”","grammarZh":"IMPOSSIBLE 是形容词：an impossible task（一项不可能完成的任务）。"},{"titleZh":"一个能粘住的好点子","sceneZh":"科学家想设计一种可附着在书包和窗户上的薄型太阳能装置，形状像一张标签。","questionZh":"拼出表示“能贴在物体表面的东西”的单词。","hintsZh":["从表示“粘住、贴牢”的动词开始。","使用 STICK + -ER。"],"explainZh":"STICK + -ER → STICKER（贴纸）。-ER 有时能表示与某个动作有关的人或物。","originZh":"Sticker 早期表示执行刺、扎或粘等动作的人或物；表示不干胶标签的用法见于19世纪。","formation":"STICK + -ER → STICKER (noun).","formationZh":"STICK（粘贴）+ 后缀 -ER → STICKER（贴纸，名词）。"},{"titleZh":"再试一次，又一次","sceneZh":"团队测试了太多次，已经没有人记得具体次数。","questionZh":"拼出表示“多得数不清”的形容词。","hintsZh":["前半部分表示“计数”。","-LESS 可以表示“没有……的”。"],"explainZh":"COUNT + -LESS → COUNTLESS，表示“多得无法计数的、无数的”。","originZh":"Countless 从16世纪后期开始有英语使用记录，由 count 和 -less 组成。","formation":"COUNT + -LESS → COUNTLESS (adjective).","formationZh":"COUNT（数数）+ -LESS（没有……的）→ COUNTLESS（无数的，形容词）。"},{"titleZh":"比萨盒妙招","sceneZh":"科学家在两个部件之间放入薄薄的一层材料。现在两个部件可以彼此移开。","questionZh":"哪个动词可以描述他们的动作？","hintsZh":["两个部件不再连在一起。","选择表示“分开”的词。"],"explainZh":"SEPARATE 意为“分开、隔开”。在课文情境中，这帮助科学家解决设计难题。","originZh":"separate 的词源可追溯到拉丁语 separare，意为“使分开”。","grammar":"SEPARATE can be a verb (“separate two parts”) or an adjective (“two separate parts”).","grammarZh":"SEPARATE 可以作动词（separate two parts：把两个部件分开），也可以作形容词（two separate parts：两个分开的部件）。"},{"titleZh":"保持希望","sceneZh":"你的团队说：“______，我们新的太阳能装置有一天能帮助很多人。”","questionZh":"拼出适合填入句中的副词。","hintsZh":["先把 HOPE 和 -FUL 组成 HOPEFUL。","然后加 -LY，构成副词。"],"explainZh":"HOPE + FUL + LY → HOPEFULLY。在这个句首位置，它表示“希望如此、但愿”。","originZh":"Hopefully 早期表示“充满希望地”，后来又发展出表示说话者希望某事发生的句子副词用法。","formation":"HOPE + -FUL + -LY → HOPEFULLY (adverb).","formationZh":"HOPE（希望）+ -FUL + -LY → HOPEFULLY（副词）。","grammar":"“She waited hopefully.” describes how she waited. “Hopefully, it will work.” expresses the speaker’s hope for the whole sentence.","grammarZh":"She waited hopefully. 中，hopefully 修饰“等待的方式”；Hopefully, it will work.（但愿它能成功）中，hopefully 表达说话者对整句话的愿望。"},{"titleZh":"终于成功了！","sceneZh":"团队失败了很多次。今天，太阳能贴片终于完全按照计划工作了！","questionZh":"团队终于做到了什么？","hintsZh":["他们取得了想要的结果。","选择 FAIL 的反义词。"],"explainZh":"SUCCEED 表示“成功做到想做的事”。团队在许多次失败之后终于成功了。","originZh":"Succeed 早期有“接在后面、随后发生”的意思，“取得成功”的含义是后来发展出来的。","grammar":"SUCCEED is a verb: “They succeeded.” SUCCESS is the related noun.","grammarZh":"SUCCEED 是动词：They succeeded.（他们成功了）；相关名词是 SUCCESS（成功）。"},{"titleZh":"你的感受如何？","sceneZh":"实验成功时你会微笑，在向全校展示成果之前又会紧张。","questionZh":"哪个名词可以表示快乐或紧张这样的情绪？","hintsZh":["想想内心的情绪。","它来自 FEEL + -ING。"],"explainZh":"FEELING 可以表示“情绪、感受”。这个词在历史上还与触觉密切相关。","originZh":"Feeling 早期主要与触觉、感觉有关，表达情绪的用法是后来发展的。","formation":"FEEL + -ING → FEELING (noun when it means an emotion).","formationZh":"FEEL + -ING → FEELING；表示“感受、情绪”时是名词。","grammar":"“A happy feeling” uses FEELING as a noun. “I am feeling happy” uses FEELING as part of a verb phrase.","grammarZh":"a happy feeling（愉快的感受）中 FEELING 是名词；I am feeling happy.（我现在感到开心）中 FEELING 是动词短语的一部分。"},{"titleZh":"与众不同的新想法","sceneZh":"一位同学把雨伞和手杖结合起来，让人既能走路又能挡雨。这个点子很有创意。","questionZh":"拼出表示“富有新点子、创造力”的形容词。","hintsZh":["CREATE 表示创造新事物。","在 CREATE 后加 -IVE。注意拼写变化。"],"explainZh":"CREATE 去掉末尾的 e，再加 -IVE，变成 CREATIVE（有创造力的）。不能直接把两个字符串拼成 CREATEIVE。","originZh":"creative 由 create 和后缀 -ive 构成（拼写有所变化）；create 的词源可追溯到拉丁语 creare，意为“创造、产生”。","formation":"CREATE (drop final E) + -IVE → CREATIVE.","formationZh":"CREATE（去掉末尾 e）+ -IVE → CREATIVE。","grammar":"CREATIVE is an adjective: “a creative idea.” CREATIVITY is its related noun.","grammarZh":"CREATIVE 是形容词：a creative idea（一个有创意的想法）；相关名词是 CREATIVITY（创造力）。"},{"titleZh":"从哪里握住？","sceneZh":"你把一把雨伞装到手杖上，需要增加一个方便用手握住的部件。","questionZh":"应该在设计中加上什么？","hintsZh":["这个部件是给人的手握住的。","想想 HAND 和 HANDLE 的联系。"],"explainZh":"HANDLE 是“把手”，也就是用手握住的部分。它的拼写和含义都与 HAND 有联系。","originZh":"Handle 在历史上与 hand（手）有亲缘关系。","grammar":"HANDLE is a noun in “a door handle,” but it can also be a verb: “handle a problem.”","grammarZh":"在 a door handle（门把手）中，HANDLE 是名词；在 handle a problem（处理问题）中，它也可以作动词。"},{"titleZh":"值得骄傲的一刻","sceneZh":"你的设计成功了。奶奶笑着说：“你努力了这么久，我真的为你感到 ______！”","questionZh":"选择完成这句话的单词。","hintsZh":["她为你的成就感到高兴。","常用表达是 be ___ of。"],"explainZh":"BE PROUD OF someone 意为“为某人感到骄傲、自豪”。","originZh":"proud 一词经由古法语传入英语，其更早词源可追溯到拉丁语 prode，与 improve 具有共同的历史来源。","grammar":"PROUD is an adjective. Use “be proud of + someone/something.”","grammarZh":"PROUD 是形容词，常用结构是 be proud of + 人或事物。"},{"titleZh":"最终发明 · 第一步","sceneZh":"学校希望从阳光中获得能量，科学小组请你选择合适的主要装置。","questionZh":"应该安装什么来收集太阳能？","hintsZh":["想想阳光和能源。","这个词组以 SOLAR 开头。"],"explainZh":"SOLAR PANEL（太阳能电池板）是一种用于收集阳光并帮助产生电能的装置。你已经在实际情境中运用了单元科学词汇。","originZh":"solar 一词可追溯到拉丁语 sol（太阳）；solar panel 则由 solar 和 panel 构成，是现代科技英语词组。","formation":"SOLAR + PANEL → SOLAR PANEL (noun phrase).","formationZh":"SOLAR（太阳的）+ PANEL（板）→ SOLAR PANEL（太阳能电池板，名词词组）。"},{"titleZh":"最终发明 · 第二步","sceneZh":"你的发明轻巧、实用，并由太阳能驱动。团队会反复测试，直到装置顺利运行。","questionZh":"哪一段项目报告最符合你的计划？","hintsZh":["选择一种既有利于环境、又能改进发明的方案。","留意同时包含 RENEWABLE 和 IMPROVE 的选项。"],"explainZh":"做得好！你已经把词义和 Unit 1 的主旨联系起来：勇于尝试、不断测试、持续改进。","originZh":"最后提醒：用英语表达有意义的想法，比死记罕见词源更重要。","grammar":"Use these words in context: RENEWABLE (adjective), IMPROVE (verb), SUCCEED (verb).","grammarZh":"在语境中使用：RENEWABLE 是形容词，IMPROVE 和 SUCCEED 是动词。"}];
const originMeta=[{"kind":"formation","short":"Windsurfing joins WIND and SURFING. It is a modern compound word.","shortZh":"windsurfing 由 wind（风）和 surfing（冲浪运动）组合而成，是现代合成词。","lang":"You can often understand a compound by checking each part.","langZh":"合成词往往可以通过组成部分推断意思。"},{"kind":"formation","short":"Roof gardening combines two familiar ideas: a roof and gardening.","shortZh":"roof gardening 由 roof（屋顶）和 gardening（园艺）组合而成。","lang":"A compound phrase can keep a space between its words.","langZh":"合成词组可以保留词与词之间的空格。"},{"kind":"formation","short":"A traffic light is a light that controls traffic. The two words work together.","shortZh":"traffic light 由 traffic（交通）和 light（灯）构成，表示交通信号灯。","lang":"This is an open compound: it is written as two words.","langZh":"这是开放式合成词组，书写时保留空格。"},{"kind":"history","short":"Curious is connected with the old idea of paying close attention.","shortZh":"curious 的历史词义与“仔细留意、关注”有关。","route":"Latin curiosus → Old French curios → English curious","routeZh":"拉丁语 curiosus → 古法语 curios → 英语 curious","era":"English: mid-1300s; “eager to know” by the late 1300s.","eraZh":"14 世纪中叶已见于英语；14 世纪后期出现“渴望了解”的含义。","lang":"The Latin adjective curiosus is related to cura (“care”).","langZh":"拉丁语 curiosus 与 cura（关心、照料）有词源关联。"},{"kind":"history","short":"A magazine was once a storehouse. Later, it became a “storehouse” of stories.","shortZh":"magazine 过去指“仓库”，后来被用来形容汇集文章和知识的刊物。","route":"Arabic makhāzin (plural of makhzan) → Italian magazzino → French magasin → English magazine","routeZh":"阿拉伯语 makhāzin（makhzan 的复数）→ 意大利语 magazzino → 法语 magasin → 英语 magazine","era":"1580s: “warehouse” in English; 1731: “periodical journal”.","eraZh":"16 世纪 80 年代：英语中指“仓库”；1731 年：出现“期刊、杂志”义。","lang":"The word was borrowed across languages. It is not formed from English parts MAG + AZINE.","langZh":"magazine 经由意大利语、法语传入英语，其词源可追溯到阿拉伯语 makhāzin；它并不是由现代英语的 MAG + AZINE 构成。","extra":"In 1731, The Gentleman’s Magazine used the name for a publication collecting many kinds of writing. Think of it as a storehouse of reading.","extraZh":"1731 年，《绅士杂志》（The Gentleman’s Magazine）使用 magazine 命名汇集多种文章的出版物。可以把它理解为“储存阅读材料的仓库”。"},{"kind":"formation","short":"PRINTING comes from PRINT + -ING. Here it is a noun naming a process.","shortZh":"printing 由 print 加 -ing 构成；在“3D printing”中它是表示工艺过程的名词。","era":"The noun printing is recorded in English from the late 1300s.","eraZh":"名词 printing 在英语中的记录可追溯到 14 世纪后期。","lang":"Compare: “3D printing is useful” (noun); “I am printing” (verb phrase).","langZh":"比较：3D printing is useful（名词）；I am printing（动词短语）。加 -ing 不一定变成名词。"},{"kind":"history","short":"Grow is an old English word related to growth. Its meaning is very familiar today.","shortZh":"grow 是历史悠久的英语单词，与生长的概念有关。","lang":"English also uses grow for becoming different: “grow stronger”.","langZh":"grow 还可以表示逐渐发生变化：grow stronger（变得更强）。"},{"kind":"history","short":"IMPROVE once had the idea of gaining a benefit. Later it came to mean making better.","shortZh":"improve 早期与“获得益处”有关，后来发展出“改进、改善”的含义。","route":"Anglo-French emprouwer → English improve; a deeper connection is Latin prode.","routeZh":"盎格鲁法语 emprouwer → 英语 improve；更早的词源可追溯到拉丁语 prode。","era":"Late 1400s: “use to one’s profit”; 1610s: “make better”.","eraZh":"15 世纪后期：为获益而使用；17 世纪 10 年代：发展出“使变得更好”的意思。","lang":"Although the spelling looks similar, improve is NOT IM- (“not”) + PROVE.","langZh":"尽管拼写相似，improve 不能拆成否定前缀 im- 加 prove。"},{"kind":"history","short":"CAMP has an older link to an open field and a place where people stay outdoors.","shortZh":"camp 的历史含义与开阔的田野、户外驻扎的地方有关。","lang":"CAMP can be a verb; CAMPING can name the activity.","langZh":"camp 可以用作动词；camping 可以表示露营这项活动。"},{"kind":"formation","short":"SOLAR means “related to the sun”. A solar cell uses light to make electricity.","shortZh":"solar 意为“太阳的”；solar cell 是利用光产生电能的装置。","route":"Latin sol (“sun”) → solar; SOLAR + CELL → solar cell.","routeZh":"拉丁语 sol（太阳）→ solar；再由 solar + cell 构成 solar cell。","lang":"This lesson mixes a historical root (SOL) with a modern technical compound.","langZh":"本关同时涉及历史词根 sol 和现代科技合成词 solar cell。"},{"kind":"formation","short":"RENEWABLE is built from RE- + NEW + -ABLE. It means “able to be renewed”.","shortZh":"renewable 由 re-（再次）、new（新的）、-able（能够……的）组合而成。","era":"The word was recorded in 1727; its energy-related use became common much later.","eraZh":"renewable 于 1727 年已有记录；用于能源领域的意思则是后来发展起来的。","lang":"Modern word parts can explain the meaning without a complicated historical route.","langZh":"借助现代英语的构词成分，就能理解词义，不必强行寻找复杂词源。"},{"kind":"formation","short":"IMPOSSIBLE uses IM- to mean “not”: not possible.","shortZh":"impossible 由否定前缀 im- 与 possible 构成，表示“不可能的”。","lang":"IM- here is a form of negative IN- before the sound /p/. Not every IM- means “not”.","langZh":"这里的 im- 是否定前缀 in- 在 /p/ 音前的变体；并非所有以 im- 开头的词都是否定含义。"},{"kind":"formation","short":"STICKER is connected with STICK + -ER. Today it can mean an adhesive label.","shortZh":"sticker 由 stick 和 -er 构成；如今常指“贴纸”。","era":"The adhesive-label sense is recorded from the 1800s (1871).","eraZh":"作为“不干胶标签”的用法见于 19 世纪（1871 年）。","lang":"The suffix -ER does not always mean a person; it can also name a thing.","langZh":"后缀 -er 不总是表示人，也可以构成表示物品的名词。"},{"kind":"formation","short":"COUNTLESS is COUNT + -LESS: too many to count.","shortZh":"countless 由 count 和 -less 构成，表示“数不清的”。","era":"The adjective is recorded from the 1580s.","eraZh":"该形容词在英语中的记录可追溯到 16 世纪 80 年代。","lang":"The suffix -LESS often means “without”, as in careless or homeless.","langZh":"后缀 -less 通常表示“没有……的”，如 careless、homeless。"},{"kind":"history","short":"SEPARATE comes from an older word meaning “set apart”.","shortZh":"separate 的词源可追溯到表示“使分开”的拉丁语词汇。","route":"Latin separare → English separate (through historical borrowing).","routeZh":"拉丁语 separare → 英语 separate（经历历史借词过程）。","lang":"A word’s history is different from how it works as a verb or adjective today.","langZh":"一个词的历史词源，与它在现代英语中的词性用法是两回事。"},{"kind":"meaning","short":"HOPEFULLY first meant “in a hopeful way”. It can also mean “I hope that…”.","shortZh":"hopefully 原先常表示“满怀希望地”，也可以表示“但愿……”。","lang":"Compare “wait hopefully” with “Hopefully, it will work.”","langZh":"比较 wait hopefully（满怀希望地等待）与 Hopefully, it will work.（但愿它能成功）。"},{"kind":"meaning","short":"SUCCEED once meant “come after”. Its meaning later grew to include “do well”.","shortZh":"succeed 早期表示“接着、随后发生”，后来发展出“获得成功”的意思。","route":"Latin succedere → Old French succeder → English succeed.","routeZh":"拉丁语 succedere → 古法语 succeder → 英语 succeed。","era":"Late 1300s: “come after”; early 1400s: “turn out well”.","eraZh":"14 世纪后期：“接着、随后”；15 世纪早期：出现“取得好结果”的用法。","lang":"A changing meaning is not the same thing as adding a prefix or suffix.","langZh":"词义演变不同于简单添加前缀或后缀。"},{"kind":"meaning","short":"FEELING first described a sense of touch. It later gained emotional meanings.","shortZh":"feeling 起初与触觉、感觉有关，后来也用来表达情绪。","lang":"“A good feeling” is a noun; “I am feeling better” uses a verb phrase.","langZh":"a good feeling 中是名词；I am feeling better 中则属于动词短语。"},{"kind":"formation","short":"CREATIVE is connected with CREATE. It describes someone with new ideas.","shortZh":"creative 与 create 属于同一词族，表示“有创造力的”。","route":"Latin creare → English create; CREATE + -IVE (with spelling change) → CREATIVE.","routeZh":"拉丁语 creare → 英语 create；create 去掉词尾 e 再加 -ive，形成 creative。","era":"CREATIVE is recorded from the 1670s; its “imaginative” sense developed later.","eraZh":"creative 在英语中的记录可追溯到 17 世纪 70 年代；表示“富有想象力的”是后来的发展。","lang":"Word family does not always mean a perfect letter-by-letter match.","langZh":"词族关系不意味着词形始终可以直接逐字母拼接。"},{"kind":"family","short":"HANDLE and HAND are related. A handle is often the part you hold.","shortZh":"handle 与 hand 在历史上有亲缘关系；把手通常就是手握的部位。","lang":"Related words may change their spelling and meaning over time.","langZh":"同一词族或有共同词源的单词，拼写和含义都可能随时间变化。"},{"kind":"history","short":"PROUD has a long history. An older form could mean “brave” or “excellent”.","shortZh":"proud 历史悠久，早期相关词义包括“勇敢、优秀”。","route":"Late Latin prode → Old French prouz/prud → English proud.","routeZh":"晚期拉丁语 prode → 古法语 prouz/prud → 英语 proud。","lang":"Surprise: PROUD and IMPROVE can both be traced back to Latin prode, even though their meanings differ.","langZh":"有趣的是：proud 与 improve 的更早词源都可追溯到拉丁语 prode，虽然今天的含义差别很大。"},{"kind":"formation","short":"SOLAR PANEL is a modern combination: a panel that collects energy from the sun.","shortZh":"solar panel 是现代合成词组，指收集太阳能的电池板。","route":"Latin sol (“sun”) → solar; SOLAR + PANEL → solar panel.","routeZh":"拉丁语 sol（太阳）→ solar；solar + panel 构成 solar panel。","lang":"SOLAR is from a historical Latin root; SOLAR PANEL is a modern technical phrase.","langZh":"solar 有拉丁语词源，而 solar panel 是现代技术词组。"},{"kind":"review","short":"You can understand new words by looking at their parts, their history, and their use.","shortZh":"理解新单词，可以从构词成分、历史词源和真实语境三个角度入手。","lang":"A spelling clue is only a clue. Check the meaning and evidence before deciding.","langZh":"拼写相似只是线索，判断词源还需要结合真实含义与可靠证据。"}];
const originExtras=[{"en":"Windsurfing combines WIND and SURFING. This is a modern English compound. The word parts help you understand the sport without memorizing an ancient word history.","zh":"windsurfing 由 wind（风）和 surfing（冲浪运动）组合而成。这是现代英语合成词，通过组成部分就能理解意思，不必强行寻找古代词源。"},{"en":"Roof gardening puts two familiar ideas together: a roof and gardening. English compounds can be written as one word or as two separate words.","zh":"roof gardening 将 roof（屋顶）和 gardening（园艺）组合起来。英语合成词既可以写成一个词，也可以保留空格。"},{"en":"Traffic light is an open compound: two words written separately but used together for one idea. Look for how the parts work together.","zh":"traffic light 是开放式合成词组：两个单词分开书写，却共同表达一个意思。可以根据组成部分推断词义。"},{"en":"Curious came into English through French. Its history can be traced back to Latin curiosus, related to cura ('care'). The idea of paying close attention later developed into wanting to know more.","zh":"curious 经由法语传入英语，其词源可追溯到拉丁语 curiosus，与 cura（关心、照料）有关。“仔细关注”的含义后来发展出“渴望了解”的意思。"},{"en":"Magazine entered English through French, with an earlier Italian connection. Its history can be traced back to Arabic makhāzin, meaning 'storehouses.' In 1731, The Gentleman's Magazine used the name for a publication that collected different kinds of writing.","zh":"magazine 经由法语传入英语，更早与意大利语有关，其词源可追溯到阿拉伯语 makhāzin（“仓库”的复数形式）。1731 年，《绅士杂志》用它命名汇集不同文章的刊物。"},{"en":"Printing is formed from PRINT + -ING. In '3D printing is useful,' it is a noun naming a process. In 'I am printing a photo,' printing is a present participle in a verb phrase.","zh":"printing 由 print 加 -ing 构成。在 3D printing is useful 中，它是表示过程的名词；在 I am printing a photo 中，它是动词短语中的现在分词。"},{"en":"Grow has been used in English for a very long time. It can describe plants becoming larger or a change in condition, as in 'grow stronger.'","zh":"grow 在英语中历史悠久。它既可以描述植物生长，也可以表示状态变化，例如 grow stronger（变得更强）。"},{"en":"Improve came into English through Anglo-French. An older sense was 'use for one's benefit'; later it came to mean 'make better.' Despite its spelling, it is not IM- ('not') + PROVE.","zh":"improve 经由盎格鲁法语传入英语，较早有“用于获益”的意思，后来发展为“改善”。虽然拼写相似，却不能拆成否定前缀 im- 加 prove。"},{"en":"Camp is historically connected with the idea of an open field. In modern English, camp can be a verb, while camping names the activity of staying outdoors.","zh":"camp 在词源上与开阔的田野有关。现代英语中 camp 可以作动词，camping 则可以表示户外露营这项活动。"},{"en":"Solar can be traced back to Latin sol, meaning 'sun.' Solar cell is a modern technical compound: a cell that changes light into electrical energy.","zh":"solar 的词源可追溯到拉丁语 sol（太阳）。solar cell 是现代科技合成词组，表示把光转换成电能的装置。"},{"en":"Renewable is formed from RE- ('again') + NEW + -ABLE ('able to'). The same word-building idea works in other words, such as reusable.","zh":"renewable 由 re-（再次）、new（新的）和 -able（能够……的）构成。这种构词方法也能帮助理解 reusable（可重复使用的）等词。"},{"en":"Impossible uses the negative prefix IM-, a form of IN- before p. This works in words like impatient, but not every word beginning with im- contains that prefix.","zh":"impossible 使用否定前缀 im-，它是 in- 在 p 音前的变体；impatient 也有类似结构。但并非所有 im- 开头的词都能这样拆解。"},{"en":"Sticker is connected with STICK + -ER. Here -ER names a thing, not a person. Compare a sticker with a printer: both can name objects.","zh":"sticker 与 stick + -er 有构词联系。这里的 -er 表示物品，而不是人。类似地，printer 也可以表示设备。"},{"en":"Countless uses COUNT + -LESS. The suffix -LESS often means 'without', as in homeless. Countless means there are so many that you cannot count them.","zh":"countless 由 count 和 -less 构成。后缀 -less 常表示“没有……的”，例如 homeless。countless 表示“多得数不清的”。"},{"en":"Separate can be traced back to Latin separare, meaning 'set apart'. Its historical origin is different from its job in a sentence, where it can be a verb or an adjective.","zh":"separate 的词源可追溯到拉丁语 separare，意为“使分开”。词源和句子中的词性是两回事：它既可以作动词，也可以作形容词。"},{"en":"Hopefully once mainly meant 'in a hopeful way', as in 'wait hopefully'. Today it can also express 'I hope that ...', as in 'Hopefully, the experiment will work.'","zh":"hopefully 过去主要表示“满怀希望地”，如 wait hopefully。今天它还可以表达“但愿……”，如 Hopefully, the experiment will work。"},{"en":"Succeed can be traced back to Latin succedere, meaning 'come after'. Over time, English also developed the sense 'turn out well' or 'achieve a goal'.","zh":"succeed 的词源可追溯到拉丁语 succedere，意为“接着、随后发生”。随着时间推移，英语中又发展出“取得好结果、获得成功”的意思。"},{"en":"Feeling first had senses connected with touch. Today it can also refer to emotions. Compare 'a happy feeling' (noun) and 'I am feeling happy' (verb phrase).","zh":"feeling 早期与触觉有关，如今也能表示情绪。比较 a happy feeling（名词）和 I am feeling happy（动词短语）。"},{"en":"Creative is related to CREATE. In English, CREATE loses its final e before -IVE is added. Its deeper history can be traced back to Latin creare, 'to bring into being'.","zh":"creative 与 create 属于同一词族。英语中 create 去掉词尾 e 再加 -ive。更早的词源可追溯到拉丁语 creare，意为“创造、使产生”。"},{"en":"Handle and hand have a historical family connection. A handle is often the part you hold with your hand, although related words can change in form and meaning over time.","zh":"handle 和 hand 在历史上有词族联系。handle 通常指可以用手握住的部位；不过，同源词的拼写和含义也可能随时间发生变化。"},{"en":"A surprising connection: proud and improve can both be traced back to Latin prode, although their meanings are very different today. Word history can reveal hidden relatives.","zh":"有趣的是，proud 和 improve 的更早词源都可追溯到拉丁语 prode，虽然它们今天的词义相差很大。词源能帮助我们发现隐藏的亲缘关系。"},{"en":"Solar is linked to Latin sol, 'sun'. Solar panel is a modern technical phrase made from two English words. These are two different kinds of word history.","zh":"solar 与拉丁语 sol（太阳）有关；solar panel 则是现代科技合成词组。历史词源和现代构词方式是两种不同的知识。"},{"en":"When you meet a new word, check its context, its parts and its history. A familiar-looking prefix is a clue, not proof: for example, improve is not IM- + PROVE.","zh":"遇到新词时，可以结合语境、构词和词源推断含义。但相似的拼写只是线索，不是证据：例如 improve 不能拆成 im- 加 prove。"}];

function bilingual(en,zh,id){const read=`<div class="spoken-english"><div class="en-text" lang="en">${safe(en)}</div>${sentenceSpeak(en)}</div>`;if(!zh)return read;let visible=state.zh||Boolean(runtime.revealed[id]);return `<div class="bilingual">${read}${visible?`<div class="cn-text" lang="zh-CN">${safe(zh)}</div>`:`<button class="translate-single" data-action="reveal-translation" data-val="${safe(id)}" type="button">译 查看中文</button>`}${!state.zh&&visible?`<button class="translate-hide" data-action="reveal-translation" data-val="${safe(id)}" type="button">隐藏中文</button>`:''}</div>`}

function aside(){let ps=percent();return `<aside class="side"><section class="paper asidecard"><div class="sectionhead"><h2 style="font-size:16px">Your Journey</h2><span class="chip">${ps}%</span></div><div class="track"><div class="fill" style="width:${ps}%"></div></div><div class="smallmuted">${Object.keys(state.earned).length} completed · ${missions.length} total missions</div><div class="separator"></div><div class="chapterlist">${chapters.map(ch=>{let n=missions.filter(x=>x.ch===ch.id).length,done=missions.filter((x,i)=>x.ch===ch.id&&state.earned[i]!==undefined).length,at=firstOf(ch.id),locked=!canOpen(at);return `<button class="chapterrow ${!locked&&ch.id===current().ch&&state.view==='play'?'active':''} ${locked?'locked':''}" ${locked?'disabled':''} data-action="jump" data-val="${at}"><span class="chico">${ch.icon}</span><div style="flex:1"><b>${ch.id} · ${ch.name}</b><span>${locked?'🔒 Locked':done+'/'+n+' missions'}</span></div></button>`}).join('')}</div></section><section class="paper asidecard"><h3>Learning Controls ${state.zh?"· 学习设置":""}</h3><div class="smallmuted">English is the main language. Turn on Chinese only when you need help.${state.zh?`<div class="cn-text">英语为主，中文辅助不会提前透露答案。也可单独翻译某一段。</div>`:``}</div><div class="actions"><button class="btn small ${state.zh?'':'ghost'}" data-action="toggle-zh">${state.zh?'🇨🇳 中文辅助 ON':'🇬🇧 中文辅助 OFF'}</button></div><div class="separator"></div><details class="etym-guide"><summary>📖 Etymology Language Guide ${state.zh?'· 词源用语说明':''}</summary><div class="guide-lines"><p><b>can be traced back to</b><span>可追溯到 · historical source / 历史来源</span></p><p><b>entered English through</b><span>经由……传入英语 · borrowing route / 借词路径</span></p><p><b>formed from</b><span>由……构成 · word formation / 构词关系</span></p><p><b>shares a common origin with</b><span>与……同源 · shared historical source / 共同的历史来源</span></p><small>Choose the wording to match the evidence. Not every word has a traceable route or date. / 应根据证据选择表述，并非每个单词都有明确的传播路径或年代。</small></div></details><div class="separator"></div><div class="smallmuted"><b>How it works</b><br>① Read the mission<br>② Use clues when needed<br>③ Solve the puzzle<br>④ Discover the word history<br>⑤ Move to the next mission</div></section></aside>`}
function renderOrigin(m,t,i){
  const x=originMeta[i];
  const labels={history:['Word History','词源故事'],formation:['How It Is Built','构词探秘'],meaning:['Meaning Over Time','词义的变化'],family:['Word Family','词族关系'],review:['Word Explorer Tip','词汇探索技巧']};
  const lab=labels[x.kind]||labels.history;
  const note=originExtras[i];
  const etymLink=m.url?`<a href="${safe(m.url)}" target="_blank" rel="noopener noreferrer">Check on Etymonline ↗</a>`:'';
  // One compact discovery combines the original short note and the story.
  // No additional click is required: students see it immediately after solving.
  return `<div class="origin"><strong>✧ ${lab[0]} ${state.zh?`· ${lab[1]}`:''}</strong><div class="origin-intro">${bilingual(note.en,note.zh,'origin-story-'+i)}</div>${etymLink?`<div class="origin-link">${etymLink}</div>`:''}</div>`;
}
function renderPlay(){
  const m=current(),num=state.current+1,t=missionTranslations[state.current],completed=runtime.solved;
  const chunks=m.type==='build'?

    `<div class="puzzlelabel">CHOOSE THE BEST ANSWER ${state.zh?'<span class="label-cn">· 选出最佳答案</span>':''}</div><div class="options">${m.options.map((v,j)=>`<button class="option" data-action="choose" data-val="${j}" ${completed?'disabled':''}><span class="letter">${String.fromCharCode(65+j)}</span><span>${safe(v)}</span></button>`).join('')}</div>`;
  const gram=t.grammar?`<div class="learning-note"><div class="notehead">▣ Grammar in Context ${state.zh?'<span class="label-cn">· 语法与词性</span>':''}</div>${bilingual(t.grammar,t.grammarZh,'grammar')}</div>`:'';
  const form=t.formation?`<div class="learning-note"><div class="notehead">◈ Word Formation ${state.zh?'<span class="label-cn">· 构词方式</span>':''}</div>${bilingual(t.formation,t.formationZh,'formation')}</div>`:'';
  const solved=completed?`<div class="success" aria-live="polite"><h3>✓ Mission complete! ${state.zh?'/ 任务完成！':''} +${state.earned[state.current]||0} XP</h3><div class="notehead">Word Discovery ${state.zh?'<span class="label-cn">· 单词解析</span>':''}</div>${bilingual(m.explain,t.explainZh,'explain')}${form}${gram}${renderOrigin(m,t,state.current)}<div class="actions"><button class="btn" data-action="next">${state.current===missions.length-1?'See my adventure report':'Next mission →'} ${state.zh?'/ 下一关':''}</button><button class="btn ghost" data-action="map">Chapter map ${state.zh?'· 关卡地图':''}</button></div></div>`:'';
  return `<section class="paper pad"><div class="missiontop"><span class="eyebrow">CHAPTER ${m.ch} · MISSION ${num}/${missions.length} ${state.zh?'· 关卡':''}</span><span class="pill">${completed?'✓ Complete':runtime.tries?'↻ Try again':'✦ Explorer'}</span></div><h2 class="missiontitle">${safe(m.title)}</h2>${state.zh?`<div class="missiontitle-cn" lang="zh-CN">${safe(t.titleZh)}</div>`:''}<div class="story"><span class="symbol">${m.icon}</span><div class="puzzlelabel">YOUR MISSION ${state.zh?'<span class="label-cn">· 任务背景</span>':''}</div>${bilingual(m.scene,t.sceneZh,'scene')}</div><div class="qblock"><div class="puzzlelabel">YOUR QUESTION ${state.zh?'<span class="label-cn">· 问题</span>':''}</div>${bilingual(m.question,t.questionZh,'question')}</div>${!completed?chunks:''}${runtime.error&&!completed?`<div class="error" role="status">${safe(runtime.error)}${state.zh?'<div class="cn-text">回答还不正确。可以使用提示，再试一次。</div>':''}</div>`:''}${!completed?`<div class="actions"><button class="btn ghost" data-action="hint" ${runtime.hint===2?'disabled':''}>💡 ${runtime.hint===0?'Give me a clue':runtime.hint===1?'Another clue':'All clues opened'} ${state.zh?'/ 获取提示':''}</button><span class="mini">Hints help you learn. It's OK to use them.${state.zh?'<span class="cn-text-inline">使用提示是学习的一部分。</span>':''}</span></div>${runtime.hint?`<div class="hint"><div class="notehead">Clue ${runtime.hint} ${state.zh?'<span class="label-cn">· 线索</span>':''}</div>${bilingual(m.hint[runtime.hint-1],t.hintsZh[runtime.hint-1],'hint'+runtime.hint)}</div>`:''}`:''}${solved}<div class="separator"></div><div class="ctrlrow"><button class="btn small secondary" data-action="map">🗺️ See all missions ${state.zh?'/ 关卡地图':''}</button><button class="btn small ghost" data-action="toggle-zh">${state.zh?'🇨🇳 中文辅助 ON · 关闭':'🇬🇧 中文辅助 OFF · 开启'}</button></div></section>`;
}
function mapView(){return `<section class="paper pad"><div class="sectionhead"><h2>Choose a Mission ${state.zh?"· 选择任务":""}</h2><span class="pill">${Object.keys(state.earned).length}/${missions.length} cleared</span></div><p class="instruction">The next mission unlocks when you solve the previous one. Completed missions can be replayed.${state.zh?`<div class="cn-text">完成前一个任务才能解锁下一关。已完成的关卡可以重复挑战。</div>`:``}</p>${chapters.map(ch=>{let group=missions.map((m,i)=>({...m,i})).filter(x=>x.ch===ch.id);return `<div style="margin:22px 0"><h3 style="font-size:17px;margin:0 0 12px">${ch.icon} Chapter ${ch.id} · ${ch.name}</h3><div class="mapgrid">${group.map(m=>{let lock=!canOpen(m.i),done=state.earned[m.i]!==undefined;return `<button class="maptile" ${lock?'disabled':''} data-action="jump" data-val="${m.i}"><span class="chip">${done?'✓ Completed':lock?'🔒 Locked':'▶ Available'}</span><b>${m.icon} ${m.title}</b><small>${m.word}</small></button>`}).join('')}</div></div>`}).join('')}<button class="btn ghost" data-action="restart" style="margin-top:12px">Restart full adventure</button></section>`}
function vaultView(){let list=[];for(let ch of ['A','B','C','D'])for(let item of glossary[ch])list.push({ch,word:item[0],zh:item[1]});let filtered=list.filter(x=>(runtime.filter==='all'||x.ch===runtime.filter)&&(`${x.word} ${x.zh}`.toLowerCase().includes(runtime.wordSearch.toLowerCase())));return `<section class="paper pad"><div class="sectionhead"><h2>Word Vault · Unit 1 ${state.zh?"· 单元词汇库":""}</h2><span class="pill">43 entries</span></div><p class="instruction">Checked against the textbook's <i>Words and expressions in each unit</i> list, pp. 140–141. All 43 textbook words and expressions appear here, grouped by story chapter rather than textbook category. The 23 missions practise a selected subset and related combinations; not every word has its own mission. Some compound phrases in missions are context examples, not glossary entries.${state.zh?`<div class="cn-text">词汇库收录教材第 140–141 页本单元的 43 个单词及表达项目；23 关选择部分核心词汇训练，并非每个单词都有独立关卡。部分关卡短语只是语境示例。</div>`:``}</p><div class="vaulttoolbar"><input id="word-search" class="search" type="search" placeholder="Search an English word or Chinese meaning…" value="${safe(runtime.wordSearch)}" aria-label="Find a word"><div class="ctrlrow">${['all','A','B','C','D'].map(c=>`<button class="btn small ${runtime.filter===c?'':'secondary'}" data-action="filter" data-val="${c}">${c==='all'?'All':c}</button>`).join('')}</div></div><div class="vaultgrid">${filtered.map(x=>`<div class="wordtile"><span class="dictgroup">Chapter ${x.ch}</span><div class="vault-pron-row"><b lang="en">${safe(x.word)}</b>${vaultSpeak(x.word)}</div><small>${safe(x.zh)}</small></div>`).join('')}</div>${!filtered.length?'<div class="empty">No matching words.</div>':''}<div class="separator"></div><div class="smallmuted"><b>Source:</b> Shanghai Education Publishing House, English (five-four school system), Grade 7 volume 1 (2024), vocabulary pp. 140–141. Compounding also appears in Word study support p. 125.</div></section>`}
function results(){let missed=missions.map((m,i)=>({m,i})).filter(x=>state.misses[x.i]);return `<section class="paper pad"><div class="resultbanner"><div class="cup">🏆</div><div class="eyebrow">CHAPTER E COMPLETE</div><h2>You're a Word Explorer!</h2><p>You have completed all ${missions.length} missions of Unit 1.${state.zh?`<div class="cn-text">你已经完成 Unit 1 的全部 ${missions.length} 个任务！</div>`:``}</p><div class="overview" style="justify-content:center;color:#15675b"><div class="pill">⭐ ${state.score} XP</div><div class="pill">✓ ${Object.keys(state.earned).length} words & puzzles</div><div class="pill">🧭 5 chapters</div></div></div><div class="separator"></div><h3>Your discovery journal</h3><p class="instruction">You can now identify compound words, use common prefixes and suffixes, and check surprising etymologies instead of guessing.${state.zh?`<div class="cn-text">你已经学会识别合成词、利用常见前后缀，并验证有趣的词源故事，而不是盲猜。</div>`:``}</p><h3>Words to revisit</h3>${missed.length?`<div class="review">${missed.map(x=>`<button class="btn small ghost" style="margin:4px" data-action="jump" data-val="${x.i}">${safe(x.m.word)} ↺</button>`).join('')}</div>`:'<p class="instruction">No errors recorded. Try the puzzles again without clues!</p>'}<div class="actions"><button class="btn" data-action="map">Replay chapters</button><button class="btn secondary" data-action="view" data-val="vault">Open vocabulary vault</button><button class="btn ghost" data-action="restart">Restart from zero</button></div></section>`}
function render(){root.innerHTML=`<main class="shell">${renderHeader()}${hero()}<div class="layout"><div>${state.view==='map'?mapView():state.view==='vault'?vaultView():renderPlay()}</div>${aside()}</div><div class="footer">Unofficial learning prototype · Aligned with 2024 Shanghai five-four-system Grade 7 Unit 1 · Etymonline links are source checks, not a live API integration.<br>Original game prompts and tasks. Learning progress is stored locally in this browser.</div></main>`;if(state.view==='vault'){const el=document.getElementById('word-search');el?.addEventListener('input',e=>{runtime.wordSearch=e.target.value;let sel=e.target.selectionStart;const container=el.closest('.paper');const list=[];for(let ch of ['A','B','C','D'])for(let item of glossary[ch])list.push({ch,word:item[0],zh:item[1]});const filtered=list.filter(x=>(runtime.filter==='all'||x.ch===runtime.filter)&&(`${x.word} ${x.zh}`.toLowerCase().includes(runtime.wordSearch.toLowerCase())));let tiles=container.querySelector('.vaultgrid');tiles.innerHTML=filtered.map(x=>`<div class="wordtile"><span class="dictgroup">Chapter ${x.ch}</span><div class="vault-pron-row"><b lang="en">${safe(x.word)}</b>${vaultSpeak(x.word)}</div><small>${safe(x.zh)}</small></div>`).join('')||'<div class="empty">No matching words.</div>'})}}
function markSolved(){if(runtime.solved)return;runtime.solved=true;runtime.error='';let i=state.current;if(state.earned[i]===undefined){let earned=Math.max(20,100-runtime.hint*20-Math.max(0,runtime.tries-1)*25);state.earned[i]=earned;state.score+=earned}state.maxUnlocked=Math.max(state.maxUnlocked,i+1);save();render()}
function wrong(){runtime.tries++;state.misses[state.current]=(state.misses[state.current]||0)+1;save();if(runtime.tries>=3){runtime.error='Three tries—no problem. We will unlock the answer together.';runtime.hint=2;markSolved()}else {runtime.error=`Not quite. Try using Clue ${Math.min(2,runtime.hint+1)}, then try again. Mistakes are part of learning.`;render()}}
root.addEventListener('click',e=>{let node=e.target.closest('[data-action]');if(!node)return;let a=node.dataset.action,v=node.dataset.val,m=current();switch(a){case'view':state.view=v;save();render();break;case'map':state.view='map';save();render();break;case'jump':navto(Number(v));break;case'toggle-zh':state.zh=!state.zh;save();render();break;case'reveal-translation':runtime.revealed[v]=!runtime.revealed[v];render();break;case'filter':runtime.filter=v;render();break;case'part':if(!runtime.solved&&!runtime.selected.includes(Number(v))){runtime.selected.push(Number(v));runtime.error='';render()}break;case'unpart':runtime.selected.splice(Number(v),1);runtime.error='';render();break;case'clear':runtime.selected=[];runtime.error='';render();break;case'hint':runtime.hint=Math.min(2,runtime.hint+1);runtime.error='';render();break;case'check':if(runtime.solved)return;let selected=runtime.selected.map(i=>m.tokens[i]);if(!selected.length){runtime.error='Choose some word parts first. Start with the first part of the word.';render();return}if(selected.join('|')===m.answer.join('|'))markSolved();else wrong();break;case'choose':if(runtime.solved)return;if(Number(v)===m.answer)markSolved();else wrong();break;case'next':if(state.current===missions.length-1){state.view='result';save();render();}else navto(Math.min(state.current+1,missions.length-1));break;case'restart':if(confirm('Restart the whole adventure and clear saved progress?')){state=defaults();runtime={selected:[],hint:0,tries:0,solved:false,error:'',wordSearch:'',filter:'all',revealed:{}};save();render()}break;default:break;}});
// In the finished state, a player can return to the results from any navigation path.
const originalRender=render;
render=function(){if(state.view==='result'){root.innerHTML=`<main class="shell">${renderHeader()}${hero()}<div class="layout"><div>${results()}</div>${aside()}</div><div class="footer">Word Quest v1.4 · G7 U1 · Unofficial learning prototype</div></main>`}else originalRender()};
render();
</script><script src="speech.js"></script></body></html>
