name: Validate and publish Word Quest
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project
        run: |
          python3 tests/check_site.py
          node --check quest.js
          node --check unit1-data.js
          node --check site-shell.js
          node tests/test_layout.js
          node tests/test_engine.js
          node --check review-core.js
          node tests/test_review_core.js
          node --check review-scheduler.js
          node --check review-memory.js
          node tests/test_review_memory.js
          node tests/check_content.js
          node --check content.js
          node --check speech.js
          node --check site-version.js
          node tests/test_speech.js
  browser:
    needs: validate
    # Playwright 1.56.1 does not support Ubuntu 26.04 (ubuntu-latest in late 2026).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright test dependency
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Verify vendored FSRS matches pinned npm package
        run: cmp vendor/ts-fsrs-5.4.2.umd.js node_modules/ts-fsrs/dist/index.umd.js
      - name: Install Chromium and WebKit with system dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Run real-browser regression tests
        run: npm run test:browser
      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wordquest-playwright-artifacts
          path: test-results/
          retention-days: 7
  publish:
    if: github.event_name != 'pull_request'
    needs: [validate, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
